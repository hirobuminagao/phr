{% extends "base.html" %}
{% set title = "パスワード変更" %}
{% block body %}
<header class="topbar">
  <div>
    <p class="eyebrow">Account</p>
    <h1>パスワード変更</h1>
  </div>
  <nav class="top-actions">
    <a class="ghost-button" href="/account">登録情報</a>
    <a class="ghost-button" href="/">戻る</a>
    <form method="post" action="/logout">
      <button class="ghost-button" type="submit">ログアウト</button>
    </form>
  </nav>
</header>

<main class="page narrow-page">
  {% if message %}<div class="notice">{{ message }}</div>{% endif %}
  {% if error %}<div class="alert">{{ error }}</div>{% endif %}

  <section class="panel">
    <form method="post" action="/account/password" class="form-stack">
      <label>
        <span>現在のパスワード</span>
        <input name="current_password" type="password" autocomplete="current-password" required>
      </label>
      <label>
        <span>新しいパスワード</span>
        <input name="new_password" type="password" autocomplete="new-password" required>
      </label>
      <label>
        <span>新しいパスワード確認</span>
        <input name="new_password_confirm" type="password" autocomplete="new-password" required>
      </label>
      <div class="form-actions">
        <button type="submit">変更</button>
      </div>
    </form>
  </section>
</main>
{% endblock %}
