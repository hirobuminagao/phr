<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "PHR Health Exam Admin" }}</title>
    <link rel="stylesheet" href="/static/app.css?v=20260824-manual-source-layout">
    <script src="/static/app.js?v=20260824-manual-source-layout" defer></script>
  </head>
  <body>
    {% block body %}{% endblock %}
    <div class="processing-overlay" data-processing-overlay hidden>
      <div class="processing-dialog" role="status" aria-live="polite">
        <div class="processing-spinner" aria-hidden="true"></div>
        <div>
          <strong data-processing-overlay-title>処理しています</strong>
          <span data-processing-overlay-message>しばらくお待ちください。</span>
        </div>
      </div>
    </div>
  </body>
</html>
