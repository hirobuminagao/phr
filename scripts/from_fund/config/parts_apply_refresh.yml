# parts補完用 apply_subscriber_id 再確認設定
#
# use_import_run_ids:
#   true:
#     import_run_ids に指定した run_id のみ対象にする
#   false:
#     run_id では絞らず、parts_apply_subscriber_id または parts_apply_status が NULL の全行を対象にする
#
# import_run_ids:
#   use_import_run_ids: true の場合に対象とする run_id
#
use_import_run_ids: false

import_run_ids:
  - 144
  - 146
#  - 125

mode: refresh_only

# true:
#   DB更新を行わず確認ログのみ
# false:
#   DB更新を実行

dry_run: true