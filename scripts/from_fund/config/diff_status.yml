# 差分判定設定ファイル
#
# insurer_number:
#   対象の保険者番号（8桁）
#
# fund_id:
#   対応するfund_id（任意）
#
# import_run_ids:
#   差分比較対象とするstagingのimport_run_idのリスト
#   複数指定した場合は「その複数runをまとめた最新状態」として扱う
#   例:
#     [70, 71] の場合 → run 70と71の両方に存在するデータを統合して比較
#
#   missing_from_new の判定:
#     subscribers に存在し、指定した全ての import_run_ids に存在しないデータが抽出される

insurer_number: "06139463"
fund_id: 2
import_run_ids:
  - 212
#  - 146
#  - 148

# --- 実行モード設定 ---
diff_mode: true
export_mode: true
# --- 簡易サンプル ---
# 通常運用（差分更新 + CSV出力）
# diff_mode: true
# export_mode: true
# export_split_size: 1000

# 差分確認のみ
# diff_mode: true
# export_mode: false

# CSV再出力のみ
# diff_mode: false
# export_mode: true