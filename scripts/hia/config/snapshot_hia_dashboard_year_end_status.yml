

# ==========================================
# HIAダッシュボード 年度末スナップショット設定
# ==========================================
# このファイルは、年度末時点のダッシュボード状態を
# snapshot テーブルへ固定するための設定を定義する

# ------------------------------------------
# 対象年度
# ------------------------------------------
# 固定する年度（例: 2025 = 2025年度）
fiscal_year: 2025

# ------------------------------------------
# 対象モード
# ------------------------------------------
# all       : 全保険者を対象
# selected  : 指定した保険者のみ対象
target_mode: selected

# ------------------------------------------
# 保険者番号（selected の場合のみ使用）
# ------------------------------------------
# target_mode が selected の場合、ここに対象保険者番号を列挙する
# 文字列で指定する（先頭ゼロ保持のため）
insurer_numbers:
  - "12345678"
  # - "87654321"

# ------------------------------------------
# 既存データが存在する場合の挙動
# ------------------------------------------
# error     : 既存データがあれば処理を停止（推奨・安全）
# overwrite : 対象年度＋保険者番号の既存データを削除して再作成
on_conflict: error

# ------------------------------------------
# メモ（任意）
# ------------------------------------------
# 実行理由や備考を自由に記載
notes: "2025年度 年度末スナップショット"